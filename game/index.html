<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Haven</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05040a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Haven: a top-down neon-noir crime game. Walk the city on foot, steal cars, outrun the police and work through five missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script>
  // Surface any boot failure where the screenshot harness can read it.
  window.addEventListener('error', (e) => {
    const s = document.getElementById('status');
    if (s) s.textContent = 'ERR ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
    document.title = 'SHOTERR ' + (e.message || 'unknown');
  });
  window.addEventListener('unhandledrejection', (e) => {
    const s = document.getElementById('status');
    if (s) s.textContent = 'REJ ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
    document.title = 'SHOTERR ' + ((e.reason && e.reason.message) || e.reason);
  });
</script>
<script type="module">
  import { startSession } from './src/main.js';
  startSession();
</script>
</body>
</html>
